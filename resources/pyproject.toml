[project]
name = "aivo-ip-talking-agent"
version = "0.1.0"
description = "AI IP talking short-video agent starter for Codex"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "fal-client>=1.0.0",
    "oss2>=2.18.0",
    "cos-python-sdk-v5>=1.9.0",
    "playwright>=1.45.0",
    "yt-dlp>=2025.1.15",
    "aiofiles>=23.2.1",
    "aiosqlite>=0.19.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "python-dateutil>=2.8.2",
    "gmssl>=3.2.2",
    "imageio-ffmpeg==0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]
agent = [
    "langgraph>=0.2.0",
]
mcp = [
    "mcp>=1.0.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
