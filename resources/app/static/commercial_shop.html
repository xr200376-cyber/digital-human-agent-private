<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>雄图IP智能体 自助购买</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --panel: #ffffff;
      --line: #d8e1ef;
      --text: #102033;
      --muted: #64748b;
      --brand: #0f8276;
      --blue: #2563eb;
      --soft: #eef6f5;
      --danger: #991b1b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", Arial, sans-serif;
    }
    header {
      padding: 26px 34px;
      color: #fff;
      background: #111827;
    }
    header h1 { margin: 0 0 8px; font-size: 24px; }
    header p { margin: 0; color: #cbd5e1; line-height: 1.6; }
    main {
      width: min(1160px, calc(100% - 32px));
      margin: 22px auto 42px;
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(320px, .85fr);
      gap: 16px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
      box-shadow: 0 10px 24px rgba(15, 23, 42, .06);
    }
    h2 { margin: 0 0 12px; font-size: 18px; }
    .plans {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }
    .plan {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      cursor: pointer;
      background: #fff;
    }
    .plan.active {
      border-color: var(--brand);
      background: var(--soft);
    }
    .plan strong { display: block; margin-bottom: 6px; }
    .plan small { color: var(--muted); }
    label {
      display: block;
      margin: 12px 0 6px;
      color: #475569;
      font-weight: 700;
      font-size: 13px;
    }
    input, textarea {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      padding: 10px 11px;
      font: inherit;
      color: var(--text);
      outline: none;
      background: #fff;
    }
    textarea { min-height: 76px; resize: vertical; }
    input:focus, textarea:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(15, 130, 118, .12);
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    button {
      border: 0;
      border-radius: 7px;
      padding: 11px 16px;
      font-weight: 800;
      color: #fff;
      background: var(--brand);
      cursor: pointer;
    }
    button.secondary { background: var(--blue); }
    button.ghost { background: #e8eef7; color: #102033; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
    .qr {
      min-height: 210px;
      border: 1px dashed #9fb0c8;
      border-radius: 8px;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted);
      background: #fbfdff;
      padding: 18px;
      line-height: 1.7;
    }
    .result {
      min-height: 150px;
      white-space: pre-wrap;
      border-radius: 8px;
      padding: 12px;
      color: #dff7ff;
      background: #0f172a;
      line-height: 1.7;
      word-break: break-all;
    }
    .notice {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 7px;
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #bbf7d0;
      line-height: 1.6;
    }
    .notice.bad {
      background: #fff1f2;
      color: var(--danger);
      border-color: #fecaca;
    }
    @media (max-width: 860px) {
      main, .row { grid-template-columns: 1fr; }
      .plans { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>雄图IP智能体 自助购买</h1>
    <p>选择套餐后使用微信付款，提交付款信息或上传付款截图。后台确认收款后，系统会自动发放授权码或充值积分。</p>
  </header>
  <main>
    <section class="panel">
      <h2>选择套餐</h2>
      <div id="plans" class="plans"></div>

      <div class="row">
        <div>
          <label>联系人</label>
          <input id="contactName" placeholder="例如：张三" />
        </div>
        <div>
          <label>微信号</label>
          <input id="wechat" placeholder="用于核对付款和售后联系" />
        </div>
      </div>
      <div class="row">
        <div>
          <label>手机号</label>
          <input id="phone" placeholder="可选" />
        </div>
        <div>
          <label>已有授权码</label>
          <input id="existingLicenseKey" placeholder="续费或充值时填写，新购可留空" />
        </div>
      </div>
      <label>付款备注</label>
      <input id="paymentNote" placeholder="填写微信付款备注、转账昵称或订单说明" />
      <label>付款时间</label>
      <input id="paymentTime" placeholder="例如：2026-06-23 10:30" />
      <div class="actions">
        <button id="createOrder" type="button">提交付款信息</button>
        <button id="refreshOrder" class="ghost" type="button">刷新订单状态</button>
      </div>
      <div id="notice" class="notice">正在加载套餐。</div>
    </section>

    <aside class="panel">
      <h2>微信收款码</h2>
      <div id="qrBox" class="qr">请使用你的微信收款码图片替换此处，或在交付页面写明收款方式。</div>
      <p id="payAmount">请选择套餐后查看应付金额。</p>
      <label>上传付款截图</label>
      <input id="evidenceFile" type="file" accept="image/png,image/jpeg,image/webp" />
      <div class="actions">
        <button id="uploadEvidence" class="secondary" type="button">上传付款截图</button>
      </div>
      <h2 style="margin-top:18px;">订单结果</h2>
      <div id="result" class="result">等待提交订单。授权码、积分余额和订单状态会显示在这里。</div>
    </aside>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    const money = (cents) => `￥${(Number(cents || 0) / 100).toFixed(2)}`;
    const storeKey = "aivo_shop_order_access_token";
    let plans = [];
    let selectedPlan = "";
    let currentOrderNo = localStorage.getItem("aivo_shop_order_no") || "";
    let currentAccessToken = localStorage.getItem(storeKey) || "";

    async function api(path, options = {}) {
      const headers = options.body instanceof FormData ? {} : { "Content-Type": "application/json" };
      const response = await fetch(path, { ...options, headers: { ...headers, ...(options.headers || {}) } });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.detail || response.statusText);
      return data;
    }

    function setNotice(message, bad = false) {
      $("notice").textContent = message;
      $("notice").classList.toggle("bad", bad);
    }

    function renderPlans() {
      $("plans").innerHTML = plans.map((plan) => `
        <button class="plan ${plan.product_id === selectedPlan ? "active" : ""}" type="button" data-plan="${escapeHtml(plan.product_id)}">
          <strong>${escapeHtml(plan.name)}</strong>
          <small>${money(plan.amount_cents)} / ${Number(plan.credit_grant || 0)} 积分</small>
        </button>
      `).join("");
      document.querySelectorAll("[data-plan]").forEach((item) => {
        item.onclick = () => {
          selectedPlan = item.dataset.plan;
          const plan = plans.find((row) => row.product_id === selectedPlan);
          $("payAmount").textContent = plan ? `应付金额：${money(plan.amount_cents)}，付款后提交备注或截图。` : "请选择套餐。";
          renderPlans();
        };
      });
    }

    function renderOrder(order) {
      const lines = [
        `订单号：${order.order_no || "-"}`,
        `当前状态：${order.status_label || order.status || "-"}`,
        `套餐：${order.product_name || "-"}`,
      ];
      if (order.evidence_file_id) lines.push("付款截图：已上传");
      if (order.delivery?.license_key) lines.push(`授权码：${order.delivery.license_key}`);
      if (order.delivery?.license?.credits) lines.push(`积分余额：${order.delivery.license.credits.balance}`);
      if (order.operator_note) lines.push(`处理备注：${order.operator_note}`);
      $("result").textContent = lines.join("\n");
    }

    async function refreshCurrentOrder() {
      if (!currentOrderNo) {
        setNotice("还没有订单，请先提交付款信息。", true);
        return;
      }
      const tokenQuery = currentAccessToken ? `?access_token=${encodeURIComponent(currentAccessToken)}` : "";
      const data = await api(`/shop/orders/${encodeURIComponent(currentOrderNo)}${tokenQuery}`);
      renderOrder(data.order);
      setNotice("订单状态已刷新。");
    }

    $("createOrder").onclick = async () => {
      try {
        const data = await api("/shop/orders", {
          method: "POST",
          body: JSON.stringify({
            product_id: selectedPlan,
            contact_name: $("contactName").value.trim(),
            wechat: $("wechat").value.trim(),
            phone: $("phone").value.trim(),
            existing_license_key: $("existingLicenseKey").value.trim(),
            payment_note: $("paymentNote").value.trim(),
            payment_time: $("paymentTime").value.trim(),
          }),
        });
        currentOrderNo = data.order.order_no;
        currentAccessToken = data.access_token;
        localStorage.setItem("aivo_shop_order_no", currentOrderNo);
        localStorage.setItem(storeKey, currentAccessToken);
        renderOrder(data.order);
        setNotice("订单已提交，请等待后台确认收款。");
      } catch (error) {
        setNotice(error.message, true);
      }
    };

    $("uploadEvidence").onclick = async () => {
      try {
        if (!currentOrderNo) throw new Error("请先提交付款信息。");
        const form = new FormData();
        form.append("payment_note", $("paymentNote").value.trim());
        form.append("payment_time", $("paymentTime").value.trim());
        if ($("evidenceFile").files[0]) form.append("file", $("evidenceFile").files[0]);
        const tokenQuery = currentAccessToken ? `?access_token=${encodeURIComponent(currentAccessToken)}` : "";
        const data = await api(`/shop/orders/${encodeURIComponent(currentOrderNo)}/evidence${tokenQuery}`, { method: "POST", body: form });
        renderOrder(data.order);
        setNotice("付款截图已上传。");
      } catch (error) {
        setNotice(error.message, true);
      }
    };

    $("refreshOrder").onclick = () => refreshCurrentOrder().catch((error) => setNotice(error.message, true));

    async function boot() {
      const data = await api("/shop/plans");
      plans = data.plans || [];
      selectedPlan = plans[0]?.product_id || "";
      renderPlans();
      const plan = plans.find((row) => row.product_id === selectedPlan);
      if (plan) $("payAmount").textContent = `应付金额：${money(plan.amount_cents)}，付款后提交备注或截图。`;
      setNotice(data.payment_instructions || "请选择套餐后付款。");
      if (currentOrderNo) await refreshCurrentOrder();
    }
    boot().catch((error) => setNotice(error.message, true));
  </script>
</body>
</html>
